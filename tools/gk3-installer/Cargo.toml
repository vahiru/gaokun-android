# gaokun3 安装器后端的 Rust 实现（并行轨道，见 docs/dev/installer-rust-design.md）。
# 现役仍是 scripts/live/installer-lib.sh；这里的每个入口都要先在对拍（scripts/live/duel-lib.sh）里与它逐行相同，
# 才谈得上让前端换过来。
[package]
name = "gk3-installer"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"   # 只在 1.99.0 上编过、测过（rust-toolchain.toml）；更低的版本没验证
publish = false
description = "gaokun3 installer backend (Rust rewrite of scripts/live/installer-lib.sh)"

# 零依赖（只用 std）：这个二进制以 root 身份跑、动别人整块盘 —— 每多一个 crate 就多一份要审的代码，
# 也多一处离线构建要拉网的地方。真要加依赖，先在设计文档中说明理由。
[dependencies]

[[bin]]
name = "gk3-installer"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[profile.release]
# 整数溢出在发布版里也报（默认的发布版是静默回绕 —— 正是这次重写要消灭的那种失败）
overflow-checks = true
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# 不 abort：main 里的 panic hook 要先把 `ERR code=internal-panic` 打出去（前端靠 ERR 说"出错了"、靠 touched 决定失败页）
panic = "unwind"

[lints.rust]
# 没有任何 unsafe（超时杀进程用 std 的 Child::kill，见 exec.rs 开头为什么不另开进程组）
unsafe_code = "forbid"
missing_debug_implementations = "warn"
# Result 不许丢
unused_must_use = "deny"

[lints.clippy]
# ★ 设计稿 §2 的硬规则：非测试代码里不许 unwrap / expect / panic —— 失败一律走 Result，进类型、进协议
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# 越界 = panic；用 get() 显式处理
indexing_slicing = "deny"
let_underscore_must_use = "deny"
# 输出只能经 protocol::Out（它把写失败当错误返回）；println! 遇到 EPIPE 会 panic
print_stdout = "deny"
print_stderr = "deny"
# 只有 main 能决定退出码
exit = "deny"
dbg_macro = "deny"
