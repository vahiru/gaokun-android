# Windows 安装器（installer/windows）：后端在 Linux 上交叉编译，界面在 Windows 上构建（ARM64 给平板，x64 给 PC 上测试）。
# 产物是可以直接运行的程序目录（gk3_windows.exe + backend\ 里的 gk3w、mke2fs、systemd-boot），作为 Actions 的工件下载。
#
# 版本都钉死：llvm-mingw 按 GitHub 给的 sha256，Flutter 与仓库里的 pubspec 相同（3.47.2），actions 按提交；
# mke2fs、systemd-boot、字体由各自的脚本按 sha256 下载（installer/backend/mke2fs/build.sh、sdboot/fetch.sh、
# installer/common/tool/fetch-fonts.py）。
name: Windows installer

on:
  push:
    paths:
      - 'installer/**'
      - 'tools/gk3boot/core/**'
      - 'patches/e2fsprogs/**'
      - '.github/workflows/installer-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'
  # 脚本的输出有中文与"→"：Windows 运行器的控制台是 cp1252，Python 不按 UTF-8 输出就在 print 上报 UnicodeEncodeError
  PYTHONUTF8: '1'
  LLVM_MINGW: llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64
  LLVM_MINGW_SHA256: 919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926

jobs:
  backend:
    name: gk3w + mke2fs + systemd-boot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: llvm-mingw
        run: |
          curl -fsSL --retry 3 -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  /tmp/llvm-mingw.tar.xz" | sha256sum -c
          mkdir -p "$HOME/opt" && tar -C "$HOME/opt" -xf /tmp/llvm-mingw.tar.xz
      - name: host unit tests
        run: make -C installer/backend test
      - name: build
        run: make -C installer/backend win-x64 win-arm64 mke2fs sdboot LLVM_MINGW="$HOME/opt/$LLVM_MINGW"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend
          if-no-files-found: error
          path: |
            installer/backend/build/x64/gk3w.exe
            installer/backend/build/arm64/gk3w.exe
            installer/backend/build/mke2fs-x64/mke2fs.exe
            installer/backend/build/mke2fs-x64/mke2fs.conf
            installer/backend/build/mke2fs-arm64/mke2fs.exe
            installer/backend/build/mke2fs-arm64/mke2fs.conf
            installer/backend/build/sdboot/systemd-bootaa64.efi

  test:
    name: flutter analyze + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: fonts
        run: python3 installer/common/tool/fetch-fonts.py
      - name: analyze and test
        working-directory: installer/windows
        run: |
          flutter --disable-analytics
          flutter pub get
          flutter analyze
          flutter test

  app:
    name: app (${{ matrix.arch }})
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
          - arch: x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend
          path: installer/backend/build
      - name: flutter
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git C:\flutter
          "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: fonts
        shell: pwsh
        run: python installer/common/tool/fetch-fonts.py
      - name: build
        shell: pwsh
        working-directory: installer/windows
        run: |
          flutter --disable-analytics
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
      - name: check the bundle
        shell: pwsh
        run: |
          $rel = "installer/windows/build/windows/${{ matrix.arch }}/runner/Release"
          foreach ($f in 'gk3_windows.exe', 'backend/gk3w.exe', 'backend/mke2fs.exe', 'backend/mke2fs.conf', 'backend/systemd-bootaa64.efi') {
            if (-not (Test-Path "$rel/$f")) { throw "missing $rel/$f" }
          }
          # gk3w 要是目标架构的（ARM64 的程序带 x64 的 gk3w 会在平板上靠模拟跑，测试测不出来）
          $m = [System.IO.File]::ReadAllBytes((Resolve-Path "$rel/backend/gk3w.exe"))
          $pe = [BitConverter]::ToInt32($m, 0x3c)
          $machine = [BitConverter]::ToUInt16($m, $pe + 4)
          $want = @{ 'arm64' = 0xAA64; 'x64' = 0x8664 }['${{ matrix.arch }}']
          if ($machine -ne $want) { throw ("gk3w.exe machine 0x{0:X4}, want 0x{1:X4}" -f $machine, $want) }
          Get-ChildItem -Recurse $rel | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gaokun-android-installer-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: installer/windows/build/windows/${{ matrix.arch }}/runner/Release/
