# LiveCD（installer/live 的图形安装器 + Debian live 系统）：在 GitHub 的 arm64 运行器上原生构建，与本地构建
# 同一套脚本（installer/tools/build/build-flutter.sh → build-live.sh）。产物是混合 ISO（可在 Windows 中打开后把文件拖进
# FAT32 U 盘，也可整个写入 U 盘）：
#   - gaokun3-live-<版本>.iso：不带 Android 的系统文件（gaokun3/payload/ 由用户另行放入，或由 Windows 安装器制作安装介质时写入）
#   - gaokun3-live-<版本>-android-<ROM 标签>.iso：带上下面那个 ROM 发布的系统文件（约 1.5 GB），整个写入 U 盘后也能直接安装。
#     发布构建都出；测试构建只在标签以 -payload 结尾（livecd-test-<任意>-payload）或手动运行勾选 payload 时出
#
# 什么时候跑（不随每次推送跑）：
#   - 推送 livecd-vX.Y.Z[-pre] 标签：发布构建，打包后建一个【草稿】Release，维护者改好说明再发布（不设为最新版本）
#   - 手动（Actions 页面的 Run workflow，可选分支）：测试构建，产物是 Actions 的工件。GitHub 只列出默认分支上的
#     工作流，这个文件还不在默认分支上时，改推一个 livecd-test-<任意> 标签：同样是测试构建，不建 Release
#
# 输入（都从公开来源取，按 sha256 钉死）：
#   - 内核、dtb、内核参数：ROM 发布里的 boot.img（live 与 Android 共用同一个内核），默认取下面 ROM_TAG 那一版，
#     按同一发布里的 install-artifacts.sha256 核对；手动运行时可以另指一个标签。带系统文件的 ISO 另取同一发布的
#     super.img.zst，同样核对。发布构建要求这个内核开启了
#     CONFIG_ISO9660_FS（整个写入 U 盘时从 ISO9660 分区读取 squashfs，见 build-iso.sh）；测试构建不要求
#   - GPU 固件（cage 要 GPU；zap shader 是华为专有的，Debian 的固件包里没有，见 build-rootfs.sh 的 GPU_FW）：
#     KawaiiHachimi/linux-gaokun-buildbot 的固定提交，三个文件与 ROM 的 /vendor/firmware 里的逐字节相同
#   - Flutter、Debian 基础镜像由 installer/tools/build/ 的 Dockerfile 钉死；字体由 installer/common/tool/fetch-fonts.py 按 sha256 下载
name: LiveCD

on:
  push:
    tags:
      - 'livecd-v*'
      - 'livecd-test-*'
  workflow_dispatch:
    inputs:
      rom_tag:
        description: 'ROM release in vahiru/gaokun-android whose boot.img provides the kernel'
        required: false
        default: ''
      payload:
        description: 'Also build the ISO that carries the ROM release (about 1.5 GB)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  ROM_REPO: vahiru/gaokun-android
  ROM_TAG: v1.0.0-rc.3
  FW_REPO: KawaiiHachimi/linux-gaokun-buildbot
  FW_COMMIT: 315528c028843794ccd0f3d9dab373b03033150f

jobs:
  build:
    name: LiveCD image
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      rom: ${{ steps.version.outputs.rom }}
    steps:
      - name: version
        id: version
        env:
          ROM_INPUT: ${{ inputs.rom_tag }}
          PAYLOAD_INPUT: ${{ inputs.payload }}
        run: |
          echo "rom=${ROM_INPUT:-$ROM_TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/livecd-v* || "$GITHUB_REF" == refs/tags/livecd-test-*-payload || "$PAYLOAD_INPUT" == true ]]; then
            echo "payload=yes" >> "$GITHUB_OUTPUT"
          else
            echo "payload=no" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/livecd-v* ]]; then
            v=${GITHUB_REF#refs/tags/livecd-v}
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
              || { echo "::error::the tag must look like livecd-v1.2.3 or livecd-v1.2.3-rc.1"; exit 1; }
            echo "version=$v" >> "$GITHUB_OUTPUT"
            [[ "$v" == *-* ]] && echo "prerelease=yes" >> "$GITHUB_OUTPUT" || echo "prerelease=no" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tag matches the installer version
        if: startsWith(github.ref, 'refs/tags/livecd-v')
        run: |
          # 镜像里的版本号只从 installer/live/pubspec.yaml 读（build-live.sh），标签要与它一致
          p=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' installer/live/pubspec.yaml)
          [ "$p" = '${{ steps.version.outputs.version }}' ] \
            || { echo "::error::tag livecd-v${{ steps.version.outputs.version }} but installer/live/pubspec.yaml says $p"; exit 1; }
      - name: fonts
        run: python3 installer/common/tool/fetch-fonts.py
      - name: ROM release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.rom }}
          PAYLOAD: ${{ steps.version.outputs.payload }}
        run: |
          # out/rom 只放这几个文件：带系统文件的 ISO 把整个目录放进 gaokun3/payload/
          mkdir -p out/rom
          files=(boot.img); [ "$PAYLOAD" = yes ] && files+=(super.img.zst)
          pats=(-p install-artifacts.sha256); for f in "${files[@]}"; do pats+=(-p "$f"); done
          gh release download "$TAG" -R "$ROM_REPO" -D out/rom "${pats[@]}"
          for f in "${files[@]}"; do
            ( cd out/rom && grep -E "^[0-9a-fA-F]{64} [ *]${f//./\\.}\$" install-artifacts.sha256 | sha256sum -c )
          done
          echo "kernel from $ROM_REPO $TAG"
          # 发布构建：内核要开启 CONFIG_ISO9660_FS（build-iso.sh 也会拒绝，这里在耗时的步骤之前就停下）
          if [[ "$GITHUB_REF" == refs/tags/livecd-v* ]]; then
            python3 scripts/extract-kconfig.py out/rom/boot.img | grep -qx 'CONFIG_ISO9660_FS=y' \
              || { echo "::error::the kernel in $TAG's boot.img lacks CONFIG_ISO9660_FS: a dd-written ISO could not find its squashfs"; exit 1; }
          fi
      - name: GPU firmware
        run: |
          set -euo pipefail
          while read -r sum path; do
            mkdir -p "out/vendor-firmware/$(dirname "$path")"
            curl -fsSL --retry 3 -o "out/vendor-firmware/$path" \
              "https://raw.githubusercontent.com/$FW_REPO/$FW_COMMIT/firmware/$path"
            echo "$sum  out/vendor-firmware/$path" | sha256sum -c
          done <<'EOF'
          d222f3fe290ef0516ee0ec43082596bad2df0fcbc2e0bbb26987623cef90cf76 qcom/a660_sqe.fw
          8acab7b417d9ebde89a1de9ae1e2c261d352fcab122e31ecd580cec9fe2ae5e7 qcom/a660_gmu.bin
          9e6ba820906079f6b77653ff0f90e9db52980fe3b51ab16d0575a3612d2a78d1 qcom/sc8280xp/HUAWEI/gaokun3/qcdxkmsuc8280.mbn
          EOF
      - name: disk space
        run: df -h / /tmp
      - name: installer backend tests (host)
        # 单测与 Windows 安装器的工作流一样用 clang 编（ASan / UBSan）；arm64 运行器的镜像不一定带 clang，先装
        run: |
          command -v clang >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq clang; }
          make -C installer/backend test
      - name: graphical installer (Flutter, linux-arm64)
        run: bash installer/tools/build/build-flutter.sh
      - name: live image
        env:
          PAYLOAD: ${{ steps.version.outputs.payload }}
        run: |
          allow=(); [[ "$GITHUB_REF" == refs/tags/livecd-v* ]] || allow=(--allow-no-iso9660)
          src=(--boot-img out/rom/boot.img); [ "$PAYLOAD" = yes ] && src=(--release out/rom --payload)
          bash installer/tools/build/build-live.sh "${src[@]}" --firmware out/vendor-firmware "${allow[@]}"
      - name: collect
        env:
          V: ${{ steps.version.outputs.version }}
          ROM: ${{ steps.version.outputs.rom }}
          PAYLOAD: ${{ steps.version.outputs.payload }}
        run: |
          # 带系统文件的那个用 mv：1.5 GB 左右，不再多存一份
          mkdir -p dist
          cp out/live/release.txt out/live/packages-live.lock dist/
          cp out/live/gaokun3-live.iso "dist/gaokun3-live-$V.iso"
          [ "$PAYLOAD" = yes ] && mv out/live/gaokun3-live-payload.iso "dist/gaokun3-live-$V-android-$ROM.iso"
          ( cd dist && sha256sum ./*.iso | sed 's#  \./#  #' > SHA256SUMS )
          cat dist/release.txt dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livecd-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: dist/

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/livecd-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: livecd-${{ needs.build.outputs.version }}
          path: dist
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          pre=(); [ '${{ needs.build.outputs.prerelease }}' = yes ] && pre=(--prerelease)
          gh release create "livecd-v$V" -R "$GITHUB_REPOSITORY" --draft --latest=false "${pre[@]}" \
            --title "LiveCD installer v$V" --notes "Draft: write the release notes before publishing." \
            dist/*.iso dist/SHA256SUMS dist/release.txt
