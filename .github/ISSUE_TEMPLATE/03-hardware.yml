name: Test report / 测试报告
description: You tried a feature or an accessory on a real machine. Reports that something works are just as welcome. / 你在实机上试了某项功能或某个配件，能用的结果也同样欢迎。
labels: ["test-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. Many features have only been tried on one or two machines, so every result helps. The "Needs testing on real hardware" section of [docs/TODO.md](https://github.com/vahiru/gaokun-android/blob/main/docs/TODO.md) lists what is still waiting for someone to try.
        感谢你帮忙测试。很多功能只在一两台机器上试过，每一份结果都有帮助。还在等人测试的项目，列在[docs/TODO.md](https://github.com/vahiru/gaokun-android/blob/main/docs/TODO.md)的"需要在实机上核对的改动"一节。

  - type: input
    id: subject
    attributes:
      label: What you tested / 测试内容
      placeholder: "Hotspot shared with a phone while connected to Wi-Fi / 连接Wi-Fi的同时开启热点给手机上网"
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Result / 结果
      options:
        - Works / 正常
        - Works partly / 部分正常
        - Does not work / 不正常
        - Worked before, broken now / 以前正常，现在不正常
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: The release you installed, or the output of `adb shell getprop ro.build.date.utc`. / 安装的版本，或`adb shell getprop ro.build.date.utc`的输出。
      placeholder: "v1.0.0-rc.3"
    validations:
      required: true

  - type: input
    id: machine
    attributes:
      label: Machine / 机器
      description: Model, SKU and BIOS version. If you tested on another SC8280XP device, please name it. / 型号、SKU和BIOS版本。如果是在其他SC8280XP设备上测试的，请写明设备名称。
      placeholder: "GK-W7X, SKU C233, BIOS 2.18"

  - type: input
    id: accessory
    attributes:
      label: Accessory / 使用的配件
      description: Brand and model, if an accessory was involved. / 如果用到了配件，请写明品牌和型号。
      placeholder: "UGREEN 6-in-1 USB-C hub"

  - type: textarea
    id: how
    attributes:
      label: How you tested / 测试方法
      description: The steps, in order. / 按顺序写出步骤。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs or measurements / 日志或测量数据
      description: |
        Optional, but helpful when something does not work. The [FAQ](https://github.com/vahiru/gaokun-android/blob/main/docs/FAQ.md) explains how to collect logs; the kernel log from around the moment of the test is usually the most useful.
        可选；功能不正常时尤其有帮助。抓取日志的方法见[常见问题](https://github.com/vahiru/gaokun-android/blob/main/docs/FAQ.zh-CN.md)，测试前后的内核日志通常最有用。
