name: Documentation / 文档问题
description: Something in the README, the install guide, the FAQ or another document is wrong, outdated or unclear. / README、安装说明、常见问题或其他文档中有错误、过时或不清楚的地方。
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Where / 位置
      description: The file and section. / 文件和章节。
      placeholder: "docs/INSTALL.md, System updates"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind / 类型
      options:
        - Incorrect / 内容有误
        - Outdated / 内容过时
        - Unclear or missing a step / 说明不清楚或缺少步骤
        - Broken link or command / 链接或命令失效
        - Chinese and English versions differ / 中英文版本不一致
        - Typo or formatting / 错别字或格式问题
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: Details / 详细说明
      description: What the document says, and what you think it should say. If you checked it on a machine, please include what you ran and what you saw. / 文档原来怎么写，你认为应该怎么写。如果在机器上核实过，请附上执行的操作和看到的结果。
    validations:
      required: true
