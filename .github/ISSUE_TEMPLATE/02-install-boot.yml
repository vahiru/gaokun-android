name: Install / boot failure / 安装与启动问题
description: The installation failed, or the system does not start properly. / 安装失败，或者系统无法正常启动。
labels: ["install", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry you ran into this. Please first check the "If it does not boot" section of the [install guide](https://github.com/vahiru/gaokun-android/blob/main/docs/INSTALL.md); many common cases are covered there.
        遇到这种情况很抱歉。请先看一下[安装说明](https://github.com/vahiru/gaokun-android/blob/main/docs/INSTALL.zh-CN.md)里"无法开机时"一节，常见的情况那里都有说明。

        This machine has no serial console, so most clues come from the installer's diagnostic files and from the rescue system in the boot menu. If either of them still works, the machine can usually be recovered.
        这台机器没有串口，线索主要来自安装器保存的诊断文件和开机菜单里的救援系统。只要其中一个还能用，机器一般都能救回来。

  - type: dropdown
    id: method
    attributes:
      label: How you installed or updated / 安装或更新方式
      options:
        - Graphical installer from a USB stick / 图形安装器，从U盘启动
        - Graphical installer started from Windows (gaokun3-setup.cmd) / 图形安装器，从Windows启动（gaokun3-setup.cmd）
        - Graphical installer from the boot menu / 图形安装器，从开机菜单进入
        - Command-line installer (scripts/install-gaokun3.sh) / 命令行安装器（scripts/install-gaokun3.sh）
        - System update in Settings / 设置中的系统更新
        - Other / 其他
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Install mode / 安装模式
      options:
        - Erase the whole disk / 清空整块硬盘
        - Dual boot with Windows / 与Windows双系统
        - Reinstall Android, keep data / 重新安装Android，保留数据
        - Reinstall Android, wipe data / 重新安装Android，清除数据
        - Adjust partitions manually / 手动调整分区
        - Not applicable / 不适用

  - type: dropdown
    id: stage
    attributes:
      label: Where it went wrong / 出问题的环节
      options:
        - The installer does not start / 安装器无法启动
        - The installer reported an error / 安装器报错
        - No Android entry in the boot menu after installing / 安装后开机菜单里没有Android
        - Android does not reach the desktop / Android无法进入桌面
        - It broke after a system update / 系统更新之后出了问题
        - Windows no longer starts, or asks for the BitLocker recovery key / Windows无法启动，或要求输入BitLocker恢复密钥
        - Other / 其他
    validations:
      required: true

  - type: dropdown
    id: reachable
    attributes:
      label: What still works / 现在还能进入什么
      options:
        - Android, with adb / Android，可以使用adb
        - The rescue system / 救援系统
        - Only the installer USB stick / 只有安装器U盘
        - Nothing / 都进不去
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Release and installer version / 系统与安装器版本
      description: The installer version is shown at the bottom of its side bar. / 安装器版本显示在它的侧边栏底部。
      placeholder: "v1.0.0-rc.3, installer 0.2.0-rc.2"
    validations:
      required: true

  - type: input
    id: machine
    attributes:
      label: Machine / 机器
      description: Model, SKU and BIOS version. / 型号、SKU和BIOS版本。
      placeholder: "GK-W7X, SKU C233, BIOS 2.18"

  - type: textarea
    id: what
    attributes:
      label: What happened / 问题描述
      description: What you did, and the exact error message if there was one. A photo of the screen is welcome. / 你做了哪些操作；如果有报错，请写下原文。也欢迎附上屏幕照片。
    validations:
      required: true

  - type: textarea
    id: diag
    attributes:
      label: Diagnostic files / 诊断文件
      description: |
        The installer and the rescue system save their logs in the `gaokun3/diag/` folder. On the installer USB stick this is on the partition labelled `GK3LIVE`, which any computer can open; in the rescue system it is `/media/gk3/gaokun3/diag/`. Please attach the files, after removing Wi-Fi names and MAC addresses. The [FAQ](https://github.com/vahiru/gaokun-android/blob/main/docs/FAQ.md) describes how to collect more information.
        安装器和救援系统会把日志保存在`gaokun3/diag/`文件夹里：在安装器U盘上，它位于卷标为`GK3LIVE`的分区，任何电脑都能打开；在救援系统里，它位于`/media/gk3/gaokun3/diag/`。请删除其中的Wi-Fi名称和MAC地址后作为附件上传。更多收集方法见[常见问题](https://github.com/vahiru/gaokun-android/blob/main/docs/FAQ.zh-CN.md)。

  - type: textarea
    id: extra
    attributes:
      label: Anything else / 其他补充
