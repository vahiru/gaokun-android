name: Bug report / 问题报告
description: Android starts, but something does not work as expected. / 系统能正常启动，但某项功能不正常。
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. If the system does not start or the installation failed, please use **Install / boot failure**; for a game or app, please use **Game & app compatibility**.
        感谢你花时间反馈。如果系统无法启动或安装失败，请使用**安装与启动问题**；游戏或应用的问题请使用**游戏与应用兼容性**。

        You can also hand [issues.md](https://github.com/vahiru/gaokun-android/blob/main/issues.md) to an AI assistant and let it collect the information below for you.
        也可以把[issues.md](https://github.com/vahiru/gaokun-android/blob/main/issues.md)交给AI助手，让它帮你收集下面这些信息。

  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting / 提交前
      options:
        - label: I checked the [known limitations](https://github.com/vahiru/gaokun-android/blob/main/docs/known-limitations.md) and searched existing issues, including closed ones. / 我看过[已知限制](https://github.com/vahiru/gaokun-android/blob/main/docs/known-limitations.zh-CN.md)，也搜索过现有issue（包括已关闭的）。
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area / 相关部分
      options:
        - Startup and stability / 启动与稳定性
        - Standby and battery life / 待机与续航
        - Display / 屏幕
        - Graphics and games / 图形与游戏
        - Audio / 音频
        - Wi-Fi, hotspot and Bluetooth / Wi-Fi、热点与蓝牙
        - Touchscreen, stylus, keyboard and touchpad / 触摸屏、手写笔、键盘与触控板
        - Sensors / 传感器
        - Camera / 摄像头
        - Battery and charging / 电池与充电
        - USB-C / USB-C
        - System updates / 系统更新
        - Settings and system apps / 设置与系统应用
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Version / 版本
      description: |
        If you can use adb, please paste the output of the command below. Otherwise, the release you installed (e.g. v1.0.0-rc.3) is enough.
        能使用adb的话，请粘贴下面这条命令的输出；不方便的话，写明安装的版本（如v1.0.0-rc.3）即可。
        ```
        adb shell 'getprop ro.build.date.utc; getprop ro.vendor.gaokun3.version; uname -a'
        ```
      render: shell
    validations:
      required: true

  - type: input
    id: machine
    attributes:
      label: Machine / 机器
      description: Model, SKU and BIOS version, as shown on the label or in the UEFI setup. / 型号、SKU和BIOS版本，可以在机身标签或UEFI设置中找到。
      placeholder: "GK-W7X, SKU C233, BIOS 2.18"

  - type: textarea
    id: what
    attributes:
      label: What happened / 问题描述
      description: What you saw, and what you expected instead. / 你看到了什么，原本期望的是什么。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1.
        2.
        3.

  - type: dropdown
    id: frequency
    attributes:
      label: How often / 出现频率
      options:
        - Every time / 每次都出现
        - Sometimes / 有时出现
        - Once / 只出现过一次
        - After long uptime or after standby / 长时间运行或待机唤醒后出现

  - type: textarea
    id: logs
    attributes:
      label: Logs / 日志
      description: |
        Logs help a lot. Please attach long logs as files; the [FAQ](https://github.com/vahiru/gaokun-android/blob/main/docs/FAQ.md) explains how to collect them. Before uploading, please remove anything private, such as Wi-Fi names, account names and serial numbers.
        日志对排查很有帮助。较长的日志请作为附件上传，抓取方法见[常见问题](https://github.com/vahiru/gaokun-android/blob/main/docs/FAQ.zh-CN.md)。上传前请删除Wi-Fi名称、账号名、序列号等个人信息。
        * `adb logcat -b all -d > logcat.txt`
        * `adb shell su -c dmesg > dmesg.txt`
        * For crashes: the newest file in `/data/tombstones/`. For freezes: `/data/vendor/gaokun3/hangdump-*`, if present. / 崩溃时附上`/data/tombstones/`里最新的文件；卡死时如有`/data/vendor/gaokun3/hangdump-*`，请一并附上。

  - type: textarea
    id: extra
    attributes:
      label: Anything else / 其他补充
