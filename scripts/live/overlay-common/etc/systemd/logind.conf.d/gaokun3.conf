# 电源键、合盖、睡眠键一律不处理。
# Debian 的 logind 默认是电源键 = 关机、合盖与睡眠键 = 挂起。安装器缩 NTFS、写 super 的那几分钟里，
# 习惯性按一下电源键想关屏、或者合上键盘盖等着，就是 NTFS 损坏或一块写了一半的盘。
# 挂起在这里更糟：live 里 a600000.usb 停在 role=device、没有 Android 那套 usbrole 守卫，
# 这种状态下挂起会整板复位（见 docs/dev/deep-sleep.md）。
# 另外两层防护：build-rootfs.sh 把 sleep / suspend / hibernate / hybrid-sleep 几个 target 都 mask 了；
# 图形安装器写盘时再套一层 systemd-inhibit（shell_backend.dart）。
# ⚠️ 要关机：长按电源键（固件强制断电，不经 logind），或者安装器侧栏的"关机"、救援系统里的 poweroff。
[Login]
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
