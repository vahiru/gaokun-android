disable_scan_offload=1
# ath11k的WoWLAN不支持any：写any时wpa_supplicant会把整行作废，WoWLAN就没打开，每次休眠都断开Wi-Fi、给芯片断电。
wowlan_triggers=disconnect gtk_rekey_failure
ap_scan=1
# WLAN直连：部分国家的固件信道表把全部5 GHz信道标为仅被动扫描。p2p_add_cli_chan让这些信道仍可用于平板作为客户端
# 的情况（由对方发射信号）。wpa_supplicant按触发更新的接口的配置重建P2P信道列表，wlan0的状态变化也会触发，
# 所以这一项同时写在这里和p2p_supplicant_overlay.conf中。
p2p_add_cli_chan=1
