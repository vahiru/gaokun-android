# WLAN直连的wpa_supplicant配置覆盖项，安装至/vendor/etc/wifi/。
# /data/vendor/wifi/wpa/p2p_supplicant.conf只在首次使用时由/vendor/etc/wifi/wpa_supplicant.conf复制而来，此后不再从模板重新复制；
# 本文件在每次添加P2P接口时都会读取，其中的值优先，对已有安装同样生效。
# update_config：允许wpa_supplicant写回配置。框架保存的群组靠它写入文件，否则wpa_supplicant重启后丢失。
update_config=1
# p2p_add_cli_chan：见wpa_supplicant.conf中的同名项。
p2p_add_cli_chan=1
