# SPDX-License-Identifier: CC0-1.0
#
# Software ISP tuning for the front camera (hi846).
#
# Ccm: colour correction matrices from the hi846 tuning Huawei's Windows camera
# driver ships (default node, IPE cc13, lux index 1-180). That tuning is
# Qualcomm's default, so these are generic matrices, not a calibration of this
# module. Generated by scripts/camera/gen-hi846-ccm.py, which says where the
# data comes from; do not edit by hand. Each matrix is flat over its colour
# temperature range, so each appears at both ends of its range here. With a
# Ccm the CPU debayer takes its slower matrix path.
#
# Awb: Bayesian AWB along the rear module's white-point curve, scaled by the
# front/rear gain ratios measured on one unit under two lights (about 3860 K
# and 4840 K); the generator says how. Grey world alone takes a scene filled
# with one colour for the illuminant. As for the rear camera, the prior is flat
# and the search may leave the curve by 0.02.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
  - Awb:
      algorithm: bayes
      colourGains:
        - ct: 2300
          gains: [ 1.1808, 2.7126 ]
        - ct: 2856
          gains: [ 1.4904, 2.2590 ]
        - ct: 4000
          gains: [ 2.0976, 1.9740 ]
        - ct: 5000
          gains: [ 2.3322, 1.5368 ]
        - ct: 6500
          gains: [ 2.8250, 1.3778 ]
        - ct: 7500
          gains: [ 2.9249, 1.3702 ]
      priors:
        - lux: 0
          ct: [ 2000, 8000 ]
          probability: [ 1.0, 1.0 ]
      transversePos: 0.02
      transverseNeg: 0.02
      AwbMode:
        AwbAuto:
          lo: 2300
          hi: 7500
  - Ccm:
      ccms:
        - ct: 4000  # region 1-4000 K
          ccm: [  1.52440, -0.76585,  0.24145,
                 -0.25679,  1.47707, -0.22028,
                 -0.08742, -1.04830,  2.13572 ]
          offsets: [ 0, 0, 0 ]
        - ct: 4500  # region 4500-5200 K
          ccm: [  1.55576, -0.66205,  0.10630,
                 -0.21685,  1.25537, -0.03852,
                  0.10219, -0.67859,  1.57641 ]
          offsets: [ 0, 0, 0 ]
        - ct: 5200  # region 4500-5200 K
          ccm: [  1.55576, -0.66205,  0.10630,
                 -0.21685,  1.25537, -0.03852,
                  0.10219, -0.67859,  1.57641 ]
          offsets: [ 0, 0, 0 ]
        - ct: 5800  # region 5800-6500 K
          ccm: [  2.04420, -1.17215,  0.12795,
                  0.03028,  1.15022, -0.18050,
                  0.36508, -1.29257,  1.92750 ]
          offsets: [ 0, 0, 0 ]
        - ct: 6500  # region 5800-6500 K
          ccm: [  2.04420, -1.17215,  0.12795,
                  0.03028,  1.15022, -0.18050,
                  0.36508, -1.29257,  1.92750 ]
          offsets: [ 0, 0, 0 ]
        - ct: 6700  # region 6700-10000 K
          ccm: [  2.26071, -1.39069,  0.12997,
                  0.09314,  1.10334, -0.19649,
                  0.28961, -1.27502,  1.98541 ]
          offsets: [ 0, 0, 0 ]
        - ct: 10000  # region 6700-10000 K
          ccm: [  2.26071, -1.39069,  0.12997,
                  0.09314,  1.10334, -0.19649,
                  0.28961, -1.27502,  1.98541 ]
          offsets: [ 0, 0, 0 ]
  - Adjust:
  - Agc:
      # Keep 30 fps (33 ms) until the gain reaches 8x before lengthening the
      # exposure to 66 ms. Without a mode the AGC lengthens the exposure first,
      # and with patches/libcamera/0006-0008 a 15-30 fps preview drops to
      # 15 fps in ordinary room light. hi846's analogue gain tops out at 16x.
      AeExposureMode:
        ExposureNormal:
          exposureTime: [ 33000, 66000 ]
          gain: [ 8.0, 16.0 ]
...
