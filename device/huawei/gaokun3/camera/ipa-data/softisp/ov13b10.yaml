#
# ov13b10（gaokun3 后摄）的软件 ISP 调优文件 —— 与 hi846.yaml 同形，同样只是让 colourGains 解析通过。
#
# ⚠️★ 这份文件目前【只解决一个具体的报错】，不是一份真正标定过的调优：
#   通用的 uncalibrated.yaml 缺 `colourGains`，libcamera 会打
#   "Failed to parse 'colourGains' parameter from tuning file;
#    manual colour temperature will not work properly"
#   —— 手动色温因此不工作。这里给出【单位增益】让它解析成功。
#
# ⚠️ 故意【不】启用 Ccm：色彩矫正矩阵必须实测标定（拍色卡、解线性方程），
#   随便填一个矩阵会让颜色更错而不是更对，而且上游自己在 uncalibrated.yaml
#   里就写着 "has a significant performance impact, and should only be
#   enabled if tuned"。⬜ 真要好颜色，需要一次色卡标定。
#
# Agc 的 AeExposureMode：曝光时间和增益的分配顺序。先把曝光加到 33 ms（30 fps），
#   增益到 8 倍还不够亮，才在帧率范围允许时把曝光延到 66 ms（15 fps）。不写这一项时
#   AGC 先把曝光拉满再加增益：预览模板的 15–30 fps 范围下，普通室内光也会掉到 15 fps。
#   要配合 libcamera 补丁才有曝光延长；没有补丁时曝光到不了一帧以上，行为和原来一样。
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
  - Awb:
      # ⚠️ 单位增益 —— 仅为让解析通过，不含任何标定信息。
      #   格式照抄 libipa/awb_grey.cpp:47 的 readYaml(node, "ct", "gains")。
      colourGains:
        - ct: 2860
          gains: [ 1.0, 1.0 ]
        - ct: 6500
          gains: [ 1.0, 1.0 ]
  - Adjust:
  - Agc:
      AeExposureMode:
        ExposureNormal:
          exposureTime: [ 33000, 66000 ]
          gain: [ 8.0, 15.5 ]
...
