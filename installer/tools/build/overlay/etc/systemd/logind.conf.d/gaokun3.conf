# 电源键、合盖、睡眠键一律不处理。
# Debian 的 logind 默认是电源键 = 关机、合盖与睡眠键 = 挂起。安装器缩 NTFS、写 super 的那几分钟里，
# 习惯性按一下电源键想关屏、或者合上键盘盖等着，就是 NTFS 损坏或一块写了一半的盘。
# 挂起在这里更糟：live里没有Android那套usbrole守卫，挂起尚未经实测；initramfs把port0切到host失败时，
# a600000.usb停在role=device，这种状态下挂起会整板复位（见docs/dev/deep-sleep.md）。
# 另外两层防护：build-rootfs.sh把sleep / suspend / hibernate / hybrid-sleep几个target都mask了；
# 写盘任务再套一层systemd-inhibit（installer/backend/src/linux/job.c）。
# ⚠️ 要关机：长按电源键（固件强制断电，不经logind），或者安装器侧栏的"关机"、终端里的poweroff。
[Login]
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
