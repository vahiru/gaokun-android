# 安装器前端的 Dart pub 工作区：各个 Flutter 应用与它们共用的包一起解析，
# 版本由本目录的 pubspec.lock 统一钉死（已入库）。成员：
#   common  gk3_common：共用的行协议、后端接口、fixture 回放、主题与通用控件、字体（common/README.md）
#   live    LiveCD 上的图形安装器（live/README.md）
name: gk3_installer_workspace
publish_to: 'none'

environment:
  sdk: ^3.13.2

workspace:
  - common
  - live
