name: gk3_installer
description: "gaokun3 (MateBook E Go) Android installer"
publish_to: 'none'
version: 0.2.0-rc.2+3
resolution: workspace

# ⚠️ 依赖刻意只有 Flutter SDK 自带的两个（本地化）与工作区里的 gk3_common。本仓其余代码都不拉网络依赖
#    （scripts/r2-upload.py 的文件头），这是第一个要 pub 的子项目 —— 每加一个包都要
#    能说出"为什么 SDK 自带的不够"。版本由工作区根上的 pubspec.lock 钉死（../pubspec.lock，已入库）。
environment:
  sdk: ^3.13.2
  flutter: 3.47.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any          # 版本跟 flutter_localizations 走（它钉死了 intl）
  # 共用的行协议、后端接口、fixture 回放、主题、通用控件与字体（../common/README.md）
  gk3_common:
    path: ../common

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true     # lib/l10n/*.arb → gen-l10n
  # fixture：真后端在容器里录的输出（scripts/live/gen-fixtures.sh）。
  # Mac 上开发（-d chrome）与 golden 出图时回放；设备上不用，但体积可以忽略（<100 KB）。
  assets:
    - assets/logo.png        # 侧栏的标志（与 Windows 安装器同一份，由 installer/windows/tool/icon/make-icon.sh 生成）
    - testdata/common/
    - testdata/factory/
    - testdata/windows-free/
    - testdata/windows-live/
    - testdata/windows-setup/
    - testdata/windows-setup-shrunk/
    - testdata/blank/
    - testdata/android/
  # MD3 的两套字体在 gk3_common 里声明（../common/pubspec.yaml），随这个依赖一起打包进应用
