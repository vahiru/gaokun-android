name: gk3_installer
description: "gaokun3 (MateBook E Go) Android installer"
publish_to: 'none'
version: 0.2.0-rc.2+3

# ⚠️ 依赖刻意只有 Flutter SDK 自带的两个（本地化）。本仓其余代码都不拉网络依赖
#    （scripts/r2-upload.py 的文件头），这是第一个要 pub 的子项目 —— 每加一个包都要
#    能说出"为什么 SDK 自带的不够"。版本由 pubspec.lock 钉死（已入库）。
environment:
  sdk: ^3.13.2
  flutter: 3.47.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any          # 版本跟 flutter_localizations 走（它钉死了 intl）
  # MD3 自定义颜色的调和（Blend.harmonize）。flutter SDK 自己就依赖它并钉死了版本，这里跟着走
  material_color_utilities: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true     # lib/l10n/*.arb → gen-l10n
  # fixture：真后端在容器里录的输出（scripts/live/gen-fixtures.sh）。
  # Mac 上开发（-d chrome）与 golden 出图时回放；设备上不用，但体积可以忽略（<100 KB）。
  assets:
    - testdata/common/
    - testdata/factory/
    - testdata/windows-free/
    - testdata/windows-live/
    - testdata/windows-setup/
    - testdata/windows-setup-shrunk/
    - testdata/blank/
    - testdata/android/
  # ★ MD3 的两套字体打包进应用（lib/ui/theme.dart 的说明）。文件不入库：python3 tool/fetch-fonts.py
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VF.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.otf
